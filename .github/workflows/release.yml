name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag da release, por exemplo v0.1.1. Vazio usa a versão do Cargo.toml."
        required: false
        type: string
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      number: ${{ steps.resolve.outputs.number }}
    steps:
      - uses: actions/checkout@v5
      - name: Resolve the release tag
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          crate_version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2 | tr -d '[:space:]')"
          if [ -z "$crate_version" ]; then
            echo "Could not read the version from Cargo.toml." >&2
            exit 1
          fi
          if [ "$EVENT_NAME" = "push" ]; then
            requested="${GITHUB_REF_NAME}"
          else
            requested="$REQUESTED_VERSION"
          fi
          requested="$(printf '%s' "$requested" | tr -d '[:space:]')"
          requested="${requested#[vV]}"
          if [ -z "$requested" ]; then
            requested="$crate_version"
          fi
          if [ "$requested" != "$crate_version" ]; then
            echo "Release version '$requested' does not match Cargo.toml version '$crate_version'." >&2
            echo "Leave the version field empty to publish v$crate_version, or change Cargo.toml first." >&2
            exit 1
          fi
          echo "Publishing v$crate_version"
          echo "tag=v${crate_version}" >> "$GITHUB_OUTPUT"
          echo "number=${crate_version}" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux AppImage
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Package AppImage
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.number }}
        run: |
          set -eu
          version="$RELEASE_VERSION"
          appdir="ClipForge.AppDir"
          mkdir -p "$appdir/usr/bin" "$appdir/usr/share/clipforge"
          cp target/release/clipforge "$appdir/usr/bin/clipforge"
          cp assets/icons/clipforge-256.png "$appdir/clipforge.png"
          cp packaging/clipforge.desktop "$appdir/clipforge.desktop"
          cp packaging/linux-readme.txt "$appdir/usr/share/clipforge/README.txt"
          cat > "$appdir/AppRun" << 'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/clipforge" "$@"
          EOF
          chmod +x "$appdir/AppRun" "$appdir/usr/bin/clipforge"
          curl -fsSL -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool "$appdir" "clipforge-${version}-linux-x86_64.AppImage"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-appimage
          path: clipforge-*-linux-x86_64.AppImage
          if-no-files-found: error

  windows:
    name: Windows x86_64
    needs: version
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.number }}
        run: |
          $version = $env:RELEASE_VERSION
          $name = "clipforge-$version-windows-x86_64"
          New-Item -ItemType Directory -Force -Path $name | Out-Null
          Copy-Item target/release/clipforge.exe "$name/clipforge.exe"
          Copy-Item packaging/windows-readme.txt "$name/README.txt"
          # Zip the files themselves so extraction is not nested twice.
          Compress-Archive -Path "$name\*" -DestinationPath "$name.zip" -Force
      - uses: actions/upload-artifact@v7
        with:
          name: windows-zip
          path: clipforge-*-windows-x86_64.zip
          if-no-files-found: error

  publish:
    name: Publish
    needs: [version, linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -eu
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "${GITHUB_SHA}" \
              --title "ClipForge $TAG" \
              --notes-file packaging/release-notes.md
          fi
          gh release upload "$TAG" dist/* --clobber
