[package]
name = "clipforge"
version = "0.1.0"
edition = "2024"
description = "A desktop video clip downloader and trimmer"
license = "MIT"

[dependencies]
iced = { version = "0.14", features = ["tokio", "canvas", "image"] }
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
tokio = { version = "1", features = ["process", "fs", "io-util", "sync", "macros"] }
tempfile = "3"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
png = "0.18"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
